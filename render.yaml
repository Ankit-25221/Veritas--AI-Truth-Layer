services:
  # 🐍 Python FastAPI Backend
  - type: web
    name: truthlayer-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # You will enter this in Render UI
      - key: TAVILY_API_KEY
        sync: false # You will enter this in Render UI
      - key: FRONTEND_URL
        value: https://truthlayer.onrender.com # Change this after frontend is deployed
    rootDir: backend
    healthCheckPath: /health

  # ⚛️ React Frontend
  - type: web
    name: truthlayer-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://truthlayer-backend.onrender.com # Points to the backend service
