services:
  # 🚀 Unified TruthLayer App (Frontend + Backend)
  - type: web
    name: truthlayer-app
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://veritas-ai-truth-layer-1.onrender.com
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
    healthCheckPath: /health
